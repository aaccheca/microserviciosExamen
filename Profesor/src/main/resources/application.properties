# ================================
# SERVER CONFIGURATION
# ================================
server.port=8082

# ================================
# APPLICATION NAME (EUREKA)
# ================================
spring.application.name=profesor-service

# ================================
# EUREKA CLIENT CONFIGURATION
# ================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ================================
# H2 DATABASE (EN MEMORIA)
# ================================
spring.datasource.url=jdbc:h2:mem:profesor_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ================================
# JPA / HIBERNATE CONFIGURATION
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ================================
# H2 CONSOLE (OPCIONAL - para debugging)
# ================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================
# LOGGING
# ================================
logging.level.com.example.Profesor=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
